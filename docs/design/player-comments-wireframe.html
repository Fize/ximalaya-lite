<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>播放器与评论交互线框</title><style>body{font-family:system-ui,sans-serif;color:#222;background:#eee;margin:0;padding:20px}h1{font-size:20px}p{font-size:14px;line-height:1.5}.phones{display:flex;flex-wrap:wrap;gap:20px}.phone{width:340px;min-height:700px;box-sizing:border-box;background:white;border:2px solid #666;border-radius:24px;padding:20px;position:relative}.top,.tools,.controls,.comment-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.cover{height:240px;background:#ddd;display:grid;place-items:center;margin:25px auto;width:240px}.name{margin:20px 0 4px;font-weight:700}.muted{color:#666;font-size:13px}.line{height:4px;background:#aaa;margin:26px 0 8px}button{background:white;border:1px solid #888;border-radius:8px;padding:10px 12px;font-size:14px;cursor:pointer}.tools{margin:24px 0}.tools button{flex:1;padding:10px 3px;font-size:12px}.controls{justify-content:space-around;margin:28px 0}.round{width:48px;height:48px;border-radius:50%}.row{display:flex;gap:12px;padding:18px 0;border-bottom:1px solid #ddd}.avatar{height:36px;width:36px;border-radius:50%;background:#ccc;flex:none}.body{flex:1}.comment-list{height:360px;overflow:auto}.entry{position:sticky;bottom:0;background:white;display:flex;gap:8px;padding:16px 0;border-top:2px solid #888}.entry input{min-width:0;flex:1;padding:10px;border:1px solid #999;border-radius:8px}.back{margin-bottom:20px}.hint{color:#555;max-width:750px}</style><h1>播放器与评论：交互线框</h1><p class="hint">只展示信息层级与操作位置，不代表最终颜色、图标和视觉样式。点击“评论”查看评论区，返回可回到播放器；发送为演示，不会发布内容。</p><div class="phones"><section class="phone" id="player"><div class="top"><button>⌄</button><span>正在播放</span><span>⋯</span></div><div class="cover">作品封面</div><div class="name">当前单集标题</div><div class="top"><span class="muted">作品名称</span><button>＋ 订阅</button></div><div class="tools"><button>跳过头尾</button><button>倍速</button><button onclick="document.querySelector('#comments').scrollIntoView({behavior:'smooth'})">评论</button><button>点赞</button></div><div class="line"></div><div class="top muted"><span>12:30</span><span>36:00</span></div><div class="controls"><button>后退 15 秒</button><button class="round">▶</button><button>前进 15 秒</button></div><div class="top"><button>定时关闭</button><button>上一集</button><button>下一集</button><button>选集</button></div></section><section class="phone" id="comments"><div class="top back"><button onclick="document.querySelector('#player').scrollIntoView({behavior:'smooth'})">返回</button><b>评论</b><span></span></div><p class="muted">当前单集标题</p><div class="comment-list"><div class="row"><div class="avatar"></div><div class="body"><div class="comment-head"><b>听友昵称</b><span class="muted">11 月 16 日 15:28</span></div><p>故事很精彩，喜欢这种娓娓道来的节奏。</p></div></div><div class="row"><div class="avatar"></div><div class="body"><div class="comment-head"><b>另一位听友</b><span class="muted">昨天</span></div><p>已经听到这里了，期待下一集。</p></div></div></div><div class="entry"><input placeholder="写下你的想法" aria-label="写评论"><button onclick="alert('线框演示，不会发表')">发送</button></div><p class="muted">评论独立滚动；键盘出现时输入区上移，保持可见。加载失败可重试；发送失败保留输入。</p></section></div></html>
